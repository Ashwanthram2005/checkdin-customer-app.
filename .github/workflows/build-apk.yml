name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.checkdin --project-name checkdin .
          rm -rf test
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="checkdin"/android:label="Checkdin"/' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' "$MANIFEST"
          # Checkdin app icon (adaptive + legacy)
          cp -r android_res/. android/app/src/main/res/
          # Native launch screen: brand cream instead of white, so it flows into the logo animation
          for f in android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml; do
            if [ -f "$f" ]; then sed -i 's#<item android:drawable="[^"]*" */>#<item><color android:color="\#F5F6F0" /></item>#' "$f"; fi
          done
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$f" ]; then sed -i 's#</style>#    <item name="android:windowSplashScreenBackground">\#F5F6F0</item>\n    </style>#' "$f"; fi
          done
          # Skip release lint on plugins (AGP lint crashes on some plugins, e.g. image_picker)
          cat >> android/build.gradle.kts <<'KTS'
          subprojects {
              tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }
          }
          KTS

      - name: Install packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk checkdin.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: checkdin-apk
          path: checkdin.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Checkdin build ${{ github.run_number }}
          body: Test build of the Checkdin customer app. Download checkdin.apk below and install it on an Android phone.
          files: checkdin.apk
