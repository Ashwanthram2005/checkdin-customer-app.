name: checkdin
description: Checkdin customer app - hourly hotel stays.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  geolocator: ^14.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_icon.png
    - assets/logo_mark_ink.png
    - assets/logo_word_ink.png
    # Plus Jakarta Sans bundled so text works offline (no download on first open).
    - google_fonts/
